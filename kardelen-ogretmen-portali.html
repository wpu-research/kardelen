        /* ───────── YARDIMCILAR ───────── */
        const $ = id => document.getElementById(id);

        const topicOf = id => TOPICS.find(t => t.id === id);

        function toast(msg) {

        let audioCtx = null;

        /* ───────── VERİ (bu cihazın tarayıcısında saklanır) ───────── */
        const KEY = 'kardelen_portal_v1';

        function viewLesson() {

                </div>`;

            </div>`;
        }

        /* ───────── YOKLAMA ───────── */
        const STATUS = {
            v: { label: 'Var', icon: '✅', on: 'bg-emerald-500 text-white border-emerald-500' },
            y: { label: 'Yok', icon: '❌', on: 'bg-red-500 text-white border-red-500' },
            i: { label: 'İzinli', icon: '🟡', on: 'bg-amber-400 text-white border-amber-400' }
        };
        function setAtt(sid, val) {
            const c = activeClass(); playSound('click');
            const day = ((db.attendance[c.id] = db.attendance[c.id] || {})[state.attDate] = db.attendance[c.id][state.attDate] || {});
            if (day[sid] === val) delete day[sid]; else day[sid] = val;
            if (!Object.keys(day).length) delete db.attendance[c.id][state.attDate];
            saveDB(); render();
        }
        function allPresent() {
            const c = activeClass(); playSound('glow');
            const day = ((db.attendance[c.id] = db.attendance[c.id] || {})[state.attDate] = {});
            c.students.forEach(s => day[s.id] = 'v');
            saveDB(); render();
        }
        function setAttDate(v) { if (v) { state.attDate = v; render(); } }
        function countDay(day) { const r = { v: 0, y: 0, i: 0 }; Object.values(day || {}).forEach(x => r[x]++); return r; }

        function viewAttendance() {
            const c = activeClass();
            if (!c) return emptyClassCard();
            if (!c.students.length) return `<div class="max-w-xl mx-auto bg-white rounded-3xl p-8 shadow-xl border border-slate-200 text-center"><div class="text-5xl mb-2">📋</div><h3 class="font-fredoka text-xl font-bold">${esc(c.name)} sınıfında öğrenci yok</h3><button onclick="go('classes')" class="mt-4 px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-fredoka font-bold shadow-md">Öğrenci Ekle</button></div>`;
            const day = (db.attendance[c.id] || {})[state.attDate] || {};
            const cnt = countDay(day), unmarked = c.students.length - cnt.v - cnt.y - cnt.i;
            const rows = c.students.map((s, n) => `

                        <span class="px-3 py-1.5 rounded-full bg-amber-100 text-amber-800">🟡 İzinli: ${cnt.i}</span>
                        <span class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-600">İşaretlenmedi: ${unmarked}</span>
                    </div>
                    <div class="flex flex-col gap-2">${rows}</div>
                    <p class="text-xs text-slate-400"><i class="fa-solid fa-floppy-disk"></i> Her dokunuşta otomatik kaydedilir.</p>

                <div class="bg-white rounded-3xl p-4 md:p-5 shadow-xl border border-slate-200/80 flex flex-col gap-2 self-start">
                    <h3 class="font-fredoka font-bold text-slate-800 border-b border-slate-100 pb-2 mb-1"><i class="fa-solid fa-clock-rotate-left text-blue-500"></i> Geçmiş Yoklamalar</h3>${hist}
                </div>

        }

        /* ───────── GÜNLÜK NOTLAR ───────── */
        function viewNotes() {
            const c = activeClass();
            if (!c) return emptyClassCard();
            const edit = state.noteEdit ? db.notes.find(n => n.id === state.noteEdit) : null;
            const draft = edit || state.noteDraft || {};
            const dateV = edit ? edit.date : todayISO();
            const lessonOpts = '<option value="">— Ders seçilmedi —</option>' + LESSONS.map(l => `<option value="${l.id}" ${draft.lessonId === l.id ? 'selected' : ''}>Ders ${l.no}: ${esc(l.title)}</option>`).join('');
            const list = db.notes.filter(n => n.classId === c.id).sort((a, b) => (b.date + b.ts).localeCompare(a.date + a.ts)).map(n => {
                const L = n.lessonId ? lessonOf(n.lessonId) : null, C = L ? COLORS[topicOf(L.topic).color] : null;
                return `<div class="rounded-2xl border border-slate-200/80 bg-slate-50 p-4">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <p class="font-fredoka font-bold text-sm text-slate-700">${fmtDate(n.date)}</p>
                        <div class="flex gap-1.5">
                            <button onclick="editNote('${n.id}')" aria-label="Düzenle" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-500 hover:text-amber-600"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteNote('${n.id}')" aria-label="Sil" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-500 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    ${L ? `<span class="inline-block mt-1.5 px-2.5 py-1 rounded-full text-xs font-bold text-white ${C.badge}">${L.emoji} Ders ${L.no}: ${esc(L.title)}</span>` : ''}
                    ${n.did ? `<p class="text-xs font-bold text-slate-400 mt-2">Bugün yaptıklarımız</p><p class="text-sm text-slate-700 whitespace-pre-wrap">${esc(n.did)}</p>` : ''}
                    ${n.obs ? `<p class="text-xs font-bold text-slate-400 mt-2">Gözlem / Sonraki ders için</p><p class="text-sm text-slate-700 whitespace-pre-wrap">${esc(n.obs)}</p>` : ''}
                </div>`;
            }).join('') || '<p class="text-sm text-slate-400">Bu sınıf için henüz not yok.</p>';
            return `<div class="max-w-4xl mx-auto flex flex-col gap-6">
                <div class="bg-white rounded-3xl p-4 md:p-6 shadow-xl border border-slate-200/80 flex flex-col gap-3">
                    <h2 class="font-fredoka text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-2"><i class="fa-solid fa-pen-to-square text-amber-500"></i> ${edit ? 'Notu Düzenle' : 'Günlük Not'} • ${esc(c.name)}</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div><label class="font-fredoka font-bold text-xs text-slate-500 block mb-1">Tarih</label><input id="noteDate" type="date" value="${dateV}" class="w-full px-3 py-2 rounded-xl border-2 border-slate-200 bg-slate-50 font-fredoka font-bold text-sm focus:outline-none focus:border-amber-400"></div>
                        <div><label class="font-fredoka font-bold text-xs text-slate-500 block mb-1">İşlenen Ders</label><select id="noteLesson" class="w-full px-3 py-2 rounded-xl border-2 border-slate-200 bg-slate-50 font-fredoka font-bold text-sm focus:outline-none focus:border-amber-400">${lessonOpts}</select></div>
                    </div>
                    <div><label class="font-fredoka font-bold text-xs text-slate-500 block mb-1">Bugün neler yaptık?</label><textarea id="noteDid" rows="3" class="w-full px-3 py-2 rounded-xl border-2 border-slate-200 bg-slate-50 font-semibold text-sm focus:outline-none focus:border-amber-400" placeholder="Örn: Pil ve LED ile ışığı yaktık, anahtar ekledik.">${esc(draft.did || '')}</textarea></div>
                    <div><label class="font-fredoka font-bold text-xs text-slate-500 block mb-1">Gözlem / sonraki ders için not</label><textarea id="noteObs" rows="3" class="w-full px-3 py-2 rounded-xl border-2 border-slate-200 bg-slate-50 font-semibold text-sm focus:outline-none focus:border-amber-400" placeholder="Örn: 2 grup LED yönünü karıştırdı, tekrar edelim.">${esc(draft.obs || '')}</textarea></div>
                    <div class="flex gap-2">
                        <button onclick="saveNote()" class="px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-fredoka font-bold shadow-md active:scale-95 transition"><i class="fa-solid fa-floppy-disk mr-1"></i> ${edit ? 'Güncelle' : 'Kaydet'}</button>
                        ${edit ? '<button onclick="cancelEdit()" class="px-5 py-3 bg-white border border-slate-200 text-slate-700 rounded-xl font-fredoka font-bold active:scale-95 transition">Vazgeç</button>' : ''}
                    </div>
                </div>
                <div class="bg-white rounded-3xl p-4 md:p-6 shadow-xl border border-slate-200/80 flex flex-col gap-3">
                    <h3 class="font-fredoka font-bold text-slate-800 border-b border-slate-100 pb-2"><i class="fa-solid fa-book-open text-blue-500"></i> Geçmiş Notlar</h3>${list}
                </div>
            </div>`;
        }
        function saveNote() {
            const c = activeClass();
            const rec = { date: $('noteDate').value || todayISO(), lessonId: $('noteLesson').value, did: $('noteDid').value.trim(), obs: $('noteObs').value.trim() };
            if (!rec.did && !rec.obs) { toast('Önce bir şeyler yaz 🙂'); return; }
            if (state.noteEdit) Object.assign(db.notes.find(n => n.id === state.noteEdit), rec);
            else db.notes.push({ id: uid(), classId: c.id, ts: String(Date.now()), ...rec });
            if (rec.lessonId) { (db.done[c.id] = db.done[c.id] || {})[rec.lessonId] = db.done[c.id][rec.lessonId] || rec.date; }
            state.noteEdit = null; state.noteDraft = null; saveDB(); toast('✅ Not kaydedildi'); render();
        }
        function editNote(id) { state.noteEdit = id; render(); window.scrollTo(0, 0); }
        function cancelEdit() { state.noteEdit = null; render(); }
        function deleteNote(id) { if (!confirm('Bu not silinsin mi?')) return; db.notes = db.notes.filter(n => n.id !== id); saveDB(); render(); }

        /* ───────── SINIFLAR & ÖĞRENCİLER ───────── */
        function addClass() {
            const inp = $('newClass'), name = inp.value.trim();
            if (!name) { toast('Sınıf adını yaz (örn. 3-A)'); return; }
            const c = { id: uid(), name, students: [] };
            db.classes.push(c); db.activeClass = c.id; saveDB(); toast('✅ Sınıf eklendi'); render();
        }
        function addStudents(cid) {
            const ta = $('stu-' + cid), c = db.classes.find(x => x.id === cid);
            const names = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
            if (!names.length) { toast('Her satıra bir öğrenci adı yaz'); return; }
            names.forEach(n => c.students.push({ id: uid(), name: n }));
            saveDB(); toast(`✅ ${names.length} öğrenci eklendi`); render();
        }
        function removeStudent(cid, sid) {
            const c = db.classes.find(x => x.id === cid), s = c.students.find(x => x.id === sid);
            if (!confirm(`${s.name} listeden çıkarılsın mı? (Geçmiş yoklamalardaki kaydı da silinir)`)) return;
            c.students = c.students.filter(x => x.id !== sid);
            Object.values(db.attendance[cid] || {}).forEach(day => delete day[sid]);
            saveDB(); render();
        }
        function removeClass(cid) {
            const c = db.classes.find(x => x.id === cid);
            if (!confirm(`${c.name} sınıfı; öğrencileri, yoklamaları ve notlarıyla birlikte silinsin mi?`)) return;
            db.classes = db.classes.filter(x => x.id !== cid);
            delete db.attendance[cid]; delete db.done[cid]; db.notes = db.notes.filter(n => n.classId !== cid);
            if (db.activeClass === cid) db.activeClass = db.classes[0] ? db.classes[0].id : null;
            saveDB(); render();
        }
        function absences(cid, sid) { return Object.values(db.attendance[cid] || {}).filter(d => d[sid] === 'y').length; }

        function viewClasses() {
            const cards = db.classes.map(c => `
                <div class="rounded-2xl border-2 ${c.id === db.activeClass ? 'border-amber-400 bg-amber-50/40' : 'border-slate-200 bg-slate-50'} p-4 flex flex-col gap-3">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <h3 class="font-fredoka font-bold text-lg text-slate-800">${esc(c.name)} <span class="text-xs font-bold text-slate-400">${c.students.length} öğrenci</span></h3>
                        <div class="flex gap-1.5">
                            ${c.id === db.activeClass ? '<span class="px-3 py-1.5 rounded-lg bg-amber-400 text-white text-xs font-fredoka font-bold">Aktif</span>' : `<button onclick="setClass('${c.id}')" class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-xs font-fredoka font-bold text-slate-600 hover:bg-slate-50">Aktif yap</button>`}
                            <button onclick="removeClass('${c.id}')" aria-label="Sınıfı sil" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-500 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5">${c.students.map((s, n) => `
                        <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-white border border-slate-200/80 text-sm font-bold text-slate-700">
                            <span class="min-w-0"><span class="text-slate-400 mr-1.5">${n + 1}.</span>${esc(s.name)}</span>
                            <span class="flex items-center gap-2 shrink-0"><span class="text-[11px] text-red-500">${absences(c.id, s.id)} devamsızlık</span>
                            <button onclick="removeStudent('${c.id}','${s.id}')" aria-label="Çıkar" class="w-7 h-7 rounded-lg text-slate-400 hover:text-red-600"><i class="fa-solid fa-xmark"></i></button></span>
                        </div>`).join('') || '<p class="text-xs text-slate-400">Henüz öğrenci yok.</p>'}</div>
                    <div><label class="font-fredoka font-bold text-xs text-slate-500 block mb-1">Öğrenci ekle (her satıra bir isim)</label>
                        <textarea id="stu-${c.id}" rows="3" class="w-full px-3 py-2 rounded-xl border-2 border-slate-200 bg-white font-semibold text-sm focus:outline-none focus:border-amber-400" placeholder="Ayşe Yılmaz&#10;Mehmet Demir"></textarea>
                        <button onclick="addStudents('${c.id}')" class="mt-2 px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-fredoka font-bold text-sm shadow-md active:scale-95 transition">Öğrencileri Ekle</button></div>
                </div>`).join('');
            return `<div class="max-w-3xl mx-auto bg-white rounded-3xl p-4 md:p-6 shadow-xl border border-slate-200/80 flex flex-col gap-4">
                <h2 class="font-fredoka text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-2"><i class="fa-solid fa-children text-pink-500"></i> Sınıflar &amp; Öğrenciler</h2>
                <div class="flex gap-2"><input id="newClass" type="text" maxlength="30" placeholder="Yeni sınıf adı (örn. 3-A)" class="flex-1 min-w-0 px-4 py-3 rounded-xl border-2 border-slate-200 bg-slate-50 font-semibold focus:outline-none focus:border-amber-400">
                    <button onclick="addClass()" class="px-5 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-fredoka font-bold shadow-md active:scale-95 transition">+ Ekle</button></div>
                ${cards || '<p class="text-sm text-slate-400">Henüz sınıf yok. Yukarıdan ekleyebilirsin.</p>'}
            </div>`;
        }

        /* ───────── AYARLAR ───────── */
        function changePw() {
            const a = $('pw1').value, b = $('pw2').value;
            if (a.length < 4) { toast('Şifre en az 4 karakter olsun'); return; }
            if (a !== b) { toast('İki şifre aynı değil'); return; }
            db.pwHash = hash(a); saveDB(); $('pw1').value = ''; $('pw2').value = ''; toast('✅ Şifre değiştirildi');
        }
        function download(name, text, type) {
            const url = URL.createObjectURL(new Blob([text], { type }));
            const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
        function exportData() { download(`kardelen-portal-yedek-${todayISO()}.json`, JSON.stringify(db, null, 2), 'application/json'); }
        function importData(input) {
            const f = input.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = () => {
                try {
                    const d = JSON.parse(r.result);
                    if (!Array.isArray(d.classes) || !Array.isArray(d.notes)) throw new Error('bad');
                    if (!confirm('Mevcut veriler bu yedekle DEĞİŞTİRİLSİN mi?')) return;
                    db = Object.assign({ pwHash: null, classes: [], activeClass: null, attendance: {}, notes: [], done: {} }, d);
                    saveDB(); toast('✅ Yedek yüklendi'); render();
                } catch (e) { toast('⚠️ Geçerli bir yedek dosyası değil'); }
                input.value = '';
            };
            r.readAsText(f);
        }
        function exportCSV() {
            const c = activeClass(); if (!c) { toast('Önce sınıf seç'); return; }
            const dates = Object.keys(db.attendance[c.id] || {}).sort();
            const q = s => '"' + String(s).replace(/"/g, '""') + '"';
            const rows = [[q('Öğrenci'), ...dates.map(q), q('Devamsızlık')].join(';')];
            c.students.forEach(s => rows.push([q(s.name), ...dates.map(d => q(({ v: 'Var', y: 'Yok', i: 'İzinli' })[db.attendance[c.id][d][s.id]] || '')), absences(c.id, s.id)].join(';')));
            download(`yoklama-${c.name}-${todayISO()}.csv`, '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8');
        }
        function wipeAll() {
            if (!confirm('TÜM sınıflar, yoklamalar ve notlar silinsin mi? Bu işlem geri alınamaz.')) return;
            const pw = db.pwHash; db = { pwHash: pw, classes: [], activeClass: null, attendance: {}, notes: [], done: {} };
            saveDB(); toast('Tüm veriler silindi'); render();
        }

        function viewSettings() {
            const box = 'bg-slate-50 rounded-2xl border border-slate-200/80 p-4 flex flex-col gap-2';
            const btn = 'px-5 py-2.5 rounded-xl font-fredoka font-bold text-sm shadow-md active:scale-95 transition text-white';
            return `<div class="max-w-2xl mx-auto bg-white rounded-3xl p-4 md:p-6 shadow-xl border border-slate-200/80 flex flex-col gap-4">
                <h2 class="font-fredoka text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-2"><i class="fa-solid fa-gear text-slate-500"></i> Ayarlar</h2>
                <div class="${box}"><h3 class="font-fredoka font-bold text-slate-700"><i class="fa-solid fa-key text-amber-500"></i> Şifre Değiştir</h3>
                    <input id="pw1" type="password" placeholder="Yeni şifre" class="px-4 py-3 rounded-xl border-2 border-slate-200 bg-white font-semibold focus:outline-none focus:border-amber-400">
                    <input id="pw2" type="password" placeholder="Yeni şifre (tekrar)" class="px-4 py-3 rounded-xl border-2 border-slate-200 bg-white font-semibold focus:outline-none focus:border-amber-400">
                    <button onclick="changePw()" class="${btn} bg-amber-500 hover:bg-amber-600 self-start">Şifreyi Kaydet</button></div>
                <div class="${box}"><h3 class="font-fredoka font-bold text-slate-700"><i class="fa-solid fa-cloud-arrow-down text-sky-500"></i> Yedekle / Geri Yükle</h3>
                    <p class="text-xs text-slate-500">Yoklama ve notlar yalnızca bu cihazın tarayıcısında saklanır. Düzenli yedek alman (ve telefon/bilgisayar değiştirirsen yüklemen) önerilir.</p>
                    <div class="flex flex-wrap gap-2"><button onclick="exportData()" class="${btn} bg-sky-500 hover:bg-sky-600">Yedeği İndir</button>
                    <button onclick="$('importFile').click()" class="${btn} bg-indigo-500 hover:bg-indigo-600">Yedeği Yükle</button>
                    <button onclick="exportCSV()" class="${btn} bg-emerald-500 hover:bg-emerald-600">Yoklamayı İndir (Excel/CSV)</button></div></div>
                <div class="bg-red-50 rounded-2xl border border-red-200 p-4 flex flex-col gap-2"><h3 class="font-fredoka font-bold text-red-700"><i class="fa-solid fa-triangle-exclamation"></i> Tehlikeli Bölge</h3>
                    <button onclick="wipeAll()" class="${btn} bg-red-600 hover:bg-red-700 self-start">Tüm Verileri Sil</button></div>
            </div>`;
        }

        /* ───────── KLAVYE (sunum için ← →) ───────── */
        document.addEventListener('keydown', e => {
            if (state.view !== 'lesson' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
            if (e.key === 'ArrowRight') lessonGo(1);
            else if (e.key === 'ArrowLeft') lessonGo(-1);
        });

        /* ───────── BAŞLANGIÇ ───────── */
        window.addEventListener('load', () => {
            loadDB();
            let ok = false;
            try { ok = sessionStorage.getItem('kp_ok') === '1'; } catch (e) {}
            if (ok) enterApp(); else setTimeout(() => $('pwInput').focus(), 50);
        });
    </script>
</body>
</html>
